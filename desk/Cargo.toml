[package]
name = "paja-desk"
version = "0.2.0"
description = "Paja Desk: a desktop app over Paja's core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "paja-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "paja_desk"
path = "src/lib.rs"

[dependencies]
paja = { path = "../crates/paja" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
