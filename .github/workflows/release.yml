name: Release

# A tag `v*` builds `paja` for each platform and publishes a GitHub release with the archives
# and their SHA256SUMS. Run by hand (workflow_dispatch), it builds and checks the same archives
# without publishing anything: the dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      PAJA_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p paja
      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/paja/Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match the crate version ${version} in crates/paja/Cargo.toml" >&2
            exit 1
          fi
          name="paja-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/paja.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/paja" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
          rm -r "dist/${name}"
      - name: Smoke-test the binary
        # The cross-built x86_64 macOS binary runs on Apple silicon through Rosetta.
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/paja"
          [ "${{ runner.os }}" = Windows ] && bin="${bin}.exe"
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ] && ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "no Rosetta on this runner, so the x86_64 binary is only checked by file type"
            file "$bin" | grep -q x86_64
            exit 0
          fi
          "$bin" --version
          "$bin" --json --version | grep -q "\"commit\":\"${GITHUB_SHA:0:12}\""
      - uses: actions/upload-artifact@v4
        with:
          name: paja-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desk:
    # Paja Desk's installers, each carrying the matching `paja` as a Tauri sidecar so
    # installing Desk also installs the CLI: NSIS on Windows (it puts paja on the user's PATH),
    # a dmg on macOS, an AppImage and a deb on Linux. Unsigned for now.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: dmg
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      PAJA_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install tauri-cli --version 2.12.6 --locked
      - name: Build paja for the installer
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p paja
          ext=""
          [ "${{ runner.os }}" = Windows ] && ext=".exe"
          mkdir -p desk/binaries
          cp "target/${{ matrix.target }}/release/paja${ext}" "desk/binaries/paja-${{ matrix.target }}${ext}"
      - name: Build Paja Desk
        working-directory: desk
        shell: bash
        run: cargo tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.bundle.json
      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p dist
          out="target/${{ matrix.target }}/release/bundle"
          find "$out" -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          # Tauri names them after the product, "Paja Desk", and a release asset can't hold a
          # space: paja-desk_<version>_<arch>.<ext>, as docs/setup.md lists them.
          for f in dist/*; do
            name=$(basename "$f")
            case "$name" in "Paja Desk"*) mv "$f" "dist/paja-desk${name#Paja Desk}" ;; esac
          done
          ls -l dist
          [ -n "$(ls dist)" ] || { echo "no installer under $out" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: paja-desk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, desk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: paja-*
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/paja/Cargo.toml | head -n 1)
          # The notes are CHANGELOG.md's section for this version; a dry run without one uses
          # Unreleased, so it checks the rest before the version's section is written.
          section="$version"
          if [ "${GITHUB_REF_TYPE}" != tag ] && ! grep -Eq "^## \[?${version}\]?( |$)" CHANGELOG.md; then
            section=Unreleased
          fi
          awk -v v="$section" '
            /^## / { on = ($0 ~ "^## \\[?" v "\\]?([ ]|$)"); next }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${section}; add '## ${version}' before tagging" >&2
            exit 1
          fi
          cat notes.md
      - name: Publish
        # Only a tag publishes; a run by hand stops after the checks above.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Paja ${GITHUB_REF_NAME}" --notes-file notes.md
